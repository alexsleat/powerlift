services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: powerlift-backend
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/powerlift.db
      - PORT=3001
    volumes:
      - powerlift_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: powerlift-frontend
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  powerlift_data:
    driver: local
